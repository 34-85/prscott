<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f4f6f9" />
    <script>
      // Apply saved theme before first paint to avoid a flash. Default: light.
      // Also stamp the splash start time so we can guarantee a brief, un-janky
      // minimum display before it fades.
      (function () {
        try {
          if (localStorage.getItem('psmf-theme') !== 'dark') {
            document.documentElement.classList.add('light')
          }
        } catch (e) {}
        window.__psmfSplashStart = Date.now()
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="PSMF diet, weight, and food tracking dashboard" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>PSMF Tracker</title>
    <style>
      /* Branded splash — painted before React mounts, faded out on boot.
         Works on the web and inside the native iOS shell alike. Theme-aware:
         the navy ink lightens in dark mode; the brand green/blue/gray hold. */
      #psmf-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: #0a0c10;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      html.light #psmf-splash {
        background: #f4f6f9;
      }
      #psmf-splash.psmf-hide {
        opacity: 0;
        pointer-events: none;
      }
      #psmf-splash svg {
        width: min(76vw, 360px);
        height: auto;
      }
      #psmf-splash .s-ink {
        fill: #e9eef5;
      }
      html.light #psmf-splash .s-ink {
        fill: #14243d;
      }
      #psmf-splash .s-ink-s {
        stroke: #e9eef5;
      }
      html.light #psmf-splash .s-ink-s {
        stroke: #14243d;
      }
      #psmf-splash .s-div {
        stroke: #39424f;
      }
      html.light #psmf-splash .s-div {
        stroke: #c3ccd6;
      }
      @media (prefers-reduced-motion: reduce) {
        #psmf-splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Instant-paint splash (removed by src/main.tsx once the app mounts) -->
    <div id="psmf-splash">
      <svg viewBox="0 0 440 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PSMF Tracker">
        <path d="M29.3 179.4 A195 195 0 0 1 410.7 179.4" stroke="#6cbe32" stroke-width="9" stroke-linecap="round" />
        <path d="M414.3 237 A195 195 0 0 1 270.5 408.4" stroke="#2f80c9" stroke-width="9" stroke-linecap="round" />
        <path d="M169.5 408.4 A195 195 0 0 1 25.7 237" stroke="#2f80c9" stroke-width="9" stroke-linecap="round" />
        <text x="220" y="200" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="800" font-size="104" letter-spacing="0">
          <tspan fill="#6cbe32">P</tspan><tspan class="s-ink">S</tspan><tspan fill="#2f80c9">M</tspan><tspan class="s-ink">F</tspan>
        </text>
        <line x1="96" y1="240" x2="120" y2="240" class="s-ink-s" stroke-width="3" stroke-linecap="round" />
        <line x1="320" y1="240" x2="344" y2="240" class="s-ink-s" stroke-width="3" stroke-linecap="round" />
        <text x="220" y="250" text-anchor="middle" class="s-ink" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="600" font-size="30" letter-spacing="8">TRACKER</text>
        <circle cx="127.5" cy="290" r="7" fill="none" stroke="#6cbe32" stroke-width="3.5" />
        <circle cx="213.5" cy="290" r="7" fill="none" stroke="#2f80c9" stroke-width="3.5" />
        <circle cx="287.5" cy="290" r="7" fill="none" stroke="#9aa1a9" stroke-width="3.5" />
        <line x1="196" y1="281" x2="196" y2="301" class="s-div" stroke-width="1.5" />
        <line x1="270" y1="281" x2="270" y2="301" class="s-div" stroke-width="1.5" />
        <text x="140" y="295" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="0.5" fill="#6cbe32">PROTEIN</text>
        <text x="226" y="295" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="0.5" fill="#2f80c9">CARBS</text>
        <text x="300" y="295" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="0.5" fill="#9aa1a9">FAT</text>
        <defs>
          <path id="psmfSplashTagline" d="M77.5 309 A168 168 0 0 0 362.5 309" fill="none" />
        </defs>
        <text class="s-ink" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13.5" letter-spacing="1">
          <textPath href="#psmfSplashTagline" startOffset="50%" text-anchor="middle">FOCUS &#8226; PROTECT &#8226; TRANSFORM</textPath>
        </text>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
