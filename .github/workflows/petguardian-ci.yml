name: PetGuardian CI

# Runs only when the PetGuardian app (or this workflow) changes, so it stays
# independent of the root project's Pages workflow.
on:
  push:
    paths:
      - 'petguardian/**'
      - '.github/workflows/petguardian-ci.yml'
  pull_request:
    paths:
      - 'petguardian/**'
      - '.github/workflows/petguardian-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: petguardian

jobs:
  test:
    name: Test API + build client
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pettrust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pettrust_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pettrust_test
      JWT_SECRET: ci-test-secret-not-for-production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: petguardian/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check + test API
        run: npm run test --workspace server
      - name: Type-check + build client
        run: npm run build --workspace client

  docker:
    name: Build production image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t petguardian:ci petguardian
