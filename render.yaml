# Render Blueprint for PetGuardian.
#
# Web service (Docker) that serves the API and the built React client from one
# origin. The database is now an EXTERNAL Supabase Postgres (free tier, no
# 90-day expiry). DATABASE_URL is set in the Render dashboard, not here, so the
# connection secret never lands in git.
#
# Deploy: New + -> Blueprint -> pick this repo -> Apply, then set DATABASE_URL
# to the Supabase session-pooler connection string and add DATABASE_SSL=true.

services:
  - type: web
    name: petguardian
    runtime: docker
    plan: free
    region: oregon
    # Deploy the feature branch so you can preview before merging to main.
    branch: claude/georgia-pet-trust-app-dfmfyo
    # Paths are relative to the repository root.
    dockerfilePath: ./petguardian/Dockerfile
    dockerContext: ./petguardian
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_SSL
        value: "true"
      # Supabase session-pooler connection string. Set this in the Render
      # dashboard (Environment tab); it is intentionally not stored in git.
      - key: DATABASE_URL
        sync: false
