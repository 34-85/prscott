<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- App icon: descending weight-trend line (green → blue) reaching a goal
       node, on a deep navy field. Full-bleed; iOS applies the corner mask. -->
  <defs>
    <radialGradient id="bg" cx="34%" cy="26%" r="92%">
      <stop offset="0%" stop-color="#1c3155"/>
      <stop offset="55%" stop-color="#122239"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <linearGradient id="line" x1="176" y1="360" x2="852" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6cbe32"/>
      <stop offset="100%" stop-color="#2f80c9"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- faint baseline -->
  <line x1="176" y1="770" x2="848" y2="770" stroke="#ffffff" stroke-opacity="0.10" stroke-width="8" stroke-linecap="round"/>

  <!-- descending trend line -->
  <polyline points="180,372 372,486 500,438 648,566 760,540 852,662"
            fill="none" stroke="url(#line)" stroke-width="52"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- start + goal nodes -->
  <circle cx="180" cy="372" r="30" fill="#6cbe32"/>
  <circle cx="852" cy="662" r="46" fill="#0a0d12" stroke="#6cbe32" stroke-width="20"/>
  <circle cx="852" cy="662" r="14" fill="#6cbe32"/>
</svg>
